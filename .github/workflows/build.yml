name: Build automation jar

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  # Needed to create/update the rolling release that holds the jar.
  contents: write

concurrency:
  group: build-automation-jar
  cancel-in-progress: true

jobs:
  build:
    name: Test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and package
        run: mvn -B -q package

      - name: Publish the jar to a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: automation-latest
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" target/oci-instance-automation.jar --clobber
          else
            gh release create "$TAG" target/oci-instance-automation.jar \
              --title "Automation jar" \
              --notes "Rolling build of the OCI instance automation jar. Updated on every push to main." \
              --prerelease
          fi
