name: Create OCI Always Free instance

on:
  schedule:
    # GitHub delays scheduled runs under load; every 10 minutes is the practical floor here.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A launch takes minutes; never let two runs race each other.
  group: oci-instance-create
  cancel-in-progress: false

jobs:
  create:
    name: Attempt instance creation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download the prebuilt jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target
          if ! gh release download automation-latest \
              --pattern oci-instance-automation.jar \
              --dir target \
              -R "$GITHUB_REPOSITORY"; then
            echo "::error title=Jar not found::Run the Build automation jar workflow first."
            exit 1
          fi

      - name: Write OCI credentials
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION || 'ap-singapore-1' }}
        run: |
          set -euo pipefail
          umask 077

          missing=0
          for name in OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_PRIVATE_KEY \
                      OCI_COMPARTMENT_OCID OCI_SUBNET_OCID SSH_PUBLIC_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 2
          fi

          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER_OCID"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "tenancy=$OCI_TENANCY_OCID"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/oci_api_key.pem"
          } > "$HOME/.oci/config"
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$RUNNER_TEMP/ssh_public_key.pub"

          echo "OCI_CONFIG_FILE=$HOME/.oci/config" >> "$GITHUB_ENV"
          echo "SSH_PUBLIC_KEY_FILE=$RUNNER_TEMP/ssh_public_key.pub" >> "$GITHUB_ENV"

      - name: Try to create the instance
        id: attempt
        env:
          COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          INSTANCE_NAME: ${{ vars.INSTANCE_NAME || 'free-a1' }}
          IMAGE_VERSION: ${{ vars.IMAGE_VERSION || '26.04' }}
          IMAGE_OCID: ${{ vars.IMAGE_OCID || '' }}
          BOOT_VOLUME_VPUS: ${{ vars.BOOT_VOLUME_VPUS || '20' }}
          MAX_ATTEMPTS: ${{ vars.MAX_ATTEMPTS || '3' }}
          ATTEMPT_INTERVAL_SECONDS: "120"
        run: |
          if [ "${MAX_ATTEMPTS:-}" = "0" ]; then
            echo "::warning::MAX_ATTEMPTS=0 would run until the job timeout; using 3 for this run."
            export MAX_ATTEMPTS=3
          fi

          set +e
          java -jar target/oci-instance-automation.jar 2>&1 | tee "$RUNNER_TEMP/run.log"
          code=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          case "$code" in
            0)
              echo "Instance is running or already exists."
              ;;
            3)
              echo "::notice title=No capacity yet::No instance was created in this run; the next scheduled run will retry."
              ;;
            *)
              echo "::error title=Automation failed::Exit code $code. See the log above."
              exit "$code"
              ;;
          esac

      - name: Summarise the run
        if: always()
        env:
          EXIT_CODE: ${{ steps.attempt.outputs.exit_code }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/run.log"

          case "${EXIT_CODE:-}" in
            0) result="Running, or an instance already existed" ;;
            3) result="No instance yet (capacity or rate limit); the next run retries" ;;
            "") result="The automation step did not finish" ;;
            *) result="Failed with exit code ${EXIT_CODE}" ;;
          esac

          attempts=0
          last_failure=""
          instance=""
          public_ip=""
          if [ -f "$log" ]; then
            attempts=$(grep -cE "Attempt .* (failed|hit a rate limit)" "$log" || true)
            last_failure=$(grep -E "Attempt .* (failed|hit a rate limit)" "$log" | tail -n 1 \
              | sed -E 's/^[0-9T:.Z-]+ +[A-Z]+ +[A-Za-z0-9_.]+ +- +//' | cut -c1-300 || true)
            instance=$(grep -oE "SUCCESS: instance ocid1[^ ]+" "$log" | tail -n 1 | awk '{print $3}' || true)
            if [ -z "$instance" ]; then
              instance=$(grep -E "An instance already exists in compartment" "$log" | tail -n 1 \
                | sed -E "s/.*'([^']+)' \(([^)]+)\), state ([A-Z_]+).*/\1 (\2, \3)/" || true)
            fi
            public_ip=$(grep -oE "Public IP: [0-9.]+" "$log" | tail -n 1 | awk '{print $3}' || true)
          fi

          now_utc=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          summary_file="$RUNNER_TEMP/status-block.md"
          {
            echo "### Latest run"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Time | ${now_utc} ([run #${GITHUB_RUN_NUMBER}](${run_url})) |"
            echo "| Result | ${result} |"
            echo "| Launch attempts | ${attempts} |"
            if [ -n "$instance" ]; then echo "| Instance | ${instance} |"; fi
            if [ -n "$public_ip" ]; then echo "| Public IP | \`${public_ip}\` |"; fi
            if [ -n "$last_failure" ]; then echo "| Last failure | ${last_failure//|/\\|} |"; fi
            echo "| Trigger | ${GITHUB_EVENT_NAME} |"
          } > "$summary_file"

          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Update README with latest run status
        if: always()
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Commit status to README.md
        if: always()
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/status-block.md"
          if [ ! -f "$summary_file" ] || [ ! -f README.md ]; then
            exit 0
          fi

          python3 - "$summary_file" <<'PY'
          import pathlib, re, sys
          block = pathlib.Path(sys.argv[1]).read_text().strip()
          readme = pathlib.Path("README.md")
          text = readme.read_text()
          marker = re.compile(r"<!-- STATUS:START -->.*?<!-- STATUS:END -->", re.S)
          replacement = f"<!-- STATUS:START -->\n{block}\n<!-- STATUS:END -->"
          if marker.search(text):
              new_text = marker.sub(lambda _: replacement, text, count=1)
          else:
              new_text = text
          readme.write_text(new_text)
          PY

          if git diff --quiet -- README.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update latest OCI run status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
